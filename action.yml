name: Rhysd actionlint
description: Check your workflows for common errors, like not declaring outputs before using them, bash script errors, and more!
branding:
  icon: tag
  color: gray-dark
inputs:
  fail-on-errors:
    description: "Fail the action if errors are found"
    required: false
    default: "true"
  shellcheck_opts:
    description: "Custom SHELLCHECK_OPTS"
    required: false
    default: ""
outputs:
  results-file:
    description: "Path to the json results of the linter"
    value: ${{ steps.run.outputs.resultsfile }}
    
runs:
  using: composite
  steps:
  - name: Install actionlint
    shell: bash
    id: install
    run: |
      # download the actionlint binary that is pinned in settings.json and verify its checksum
      binary=$(bash "$GITHUB_ACTION_PATH/install-actionlint.sh")
      echo "binary=$binary" >> "$GITHUB_OUTPUT"
      echo "Using actionlint binary [$binary]"
      "$binary" -version

      # actionlint picks up shellcheck and pyflakes from the PATH and silently skips those checks when they are missing
      for tool in shellcheck pyflakes; do
        if command -v "$tool" >/dev/null 2>&1; then
          echo "Found [$tool] on the PATH, actionlint will use it"
        else
          echo "::notice::[$tool] was not found on the PATH, actionlint skips the checks that need it"
        fi
      done

  - name: Run actionlint
    shell: bash
    id: run
    env:
      FAILONERRORS: ${{ inputs.fail-on-errors }}
      SHELLCHECK_OPTS: ${{ inputs.shellcheck_opts }}
      ACTIONLINT_BINARY: ${{ steps.install.outputs.binary }}
    run: |
      # execute actionlint from the downloaded binary

      # disable pipefail -e -o that is set on the shell script from the runner to prevent exiting when actionlint finds errors
      set +e +o pipefail;

      # matcher needed to annotate the PR with comments
      echo "::add-matcher::$GITHUB_ACTION_PATH/actionlint-matcher.json"

      # check if the binary is available
      if [[ -z "$ACTIONLINT_BINARY" || ! -f "$ACTIONLINT_BINARY" ]]; then
        echo "ActionLint binary [$ACTIONLINT_BINARY] not found, cannot continue"
        exit 1
      fi

      cd "$GITHUB_WORKSPACE" || exit 1

      # run to get a json result
      result=$("$ACTIONLINT_BINARY" -color -format "{{json .}}")
      status=$?

      if jq -e . >/dev/null 2>&1 <<<"$result"; then
          echo "Parsed JSON result successfully"
      else
          echo "Failed to parse JSON, or got false/null"

          # the "no project was found" message goes to stderr and is already
          # visible in the log, so $result is empty in that case
          if [[ -n "$result" && "$result" != *"no project was found in any parent directories"* ]]; then
            echo "Showing the resulting messages:"
            echo "$result"
            echo "-------------------------------"
          fi
      fi
      
      printf '%s\n' "$result" > "actionlint-errors.json"
      echo "resultsfile=actionlint-errors.json" >> "$GITHUB_OUTPUT"
      
      if [[ $status == 0 ]];
      then
        echo "Actionlint had no errors"
      else
        echo "Actionlint found errors"
        if [[ $FAILONERRORS == "true" ]]; then
          echo "Running actionlint again to show the errors"
          "$ACTIONLINT_BINARY" -color
        fi        
      fi

      if [[ $FAILONERRORS == "true" ]];
      then
        exit $status  
      fi
