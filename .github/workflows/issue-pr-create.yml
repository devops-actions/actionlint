on:
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, edited]

  push:
    paths:
      - .github/workflows/issue-pr-create.yml
  
permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
        - name: Harden the runner (Audit all outbound calls)
          uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
          with:
            egress-policy: audit

        - env:
            CONTEXT: ${{ toJSON(github.event) }}
          run: |
            echo "$CONTEXT"
           

        - uses: devops-actions/issue-comment-tag@d142a09c7661623a1f80b4267ee80ee321c20e3c # v1.0.0
          if: ${{ github.event_name != 'push' }}
          with:
            team: ${{ vars.TAG_TEAM }}
            issue: ${{ github.event.issue.number }}
            pr: ${{ github.event.pull_request.number }}
            owner: ${{ github.repository_owner }}
            repo: ${{ github.repository }}
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
