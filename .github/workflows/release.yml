name: Release

# Push a version tag (git tag v1.2.3 && git push origin v1.2.3) to publish a release.
# The reusable workflow creates the GitHub release for the tag with the action files, a
# source archive and SPDX/CycloneDX SBOMs attached, each with a verified artifact
# attestation. To (re)run it for an existing tag, start it manually and pick the tag under
# "Use workflow from".
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Release with SBOM and attestations
    permissions:
      contents: write       # create the release and upload its assets
      id-token: write       # Sigstore keyless signing for the attestations
      attestations: write   # store the attestations
    uses: devops-actions/.github/.github/workflows/rw-release-attestation.yml@f2b5c26c77264c245360c3f1f2d279947cc86503 # v1.2.0
