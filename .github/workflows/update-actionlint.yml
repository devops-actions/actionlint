name: Update the actionlint reference
on:
  push:
    paths:
      - .github/workflows/update-actionlint.yml

  schedule:
    - cron: '0 0 * * 0' # every Monday at midnight

  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: fregante/setup-git-user@024bc0b8e177d7e77203b48dab6fb45666854b35 # v2.0.2

      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "GITHUB_WORKSPACE=[$($env:GITHUB_WORKSPACE)]"
          cd $env:GITHUB_WORKSPACE

          # read the current settings: they hold the repository we download the actionlint binaries from
          $currentSettings = Get-Content -Path settings.json | ConvertFrom-Json
          $repo = $currentSettings.actionlintrepo
          $name = $currentSettings.actionlintname

          # get the latest version of actionlint from the github releases in that repo
          $headers = @{ Authorization = "Bearer $($env:GH_TOKEN)" }
          $latest=(Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/latest" -Headers $headers).tag_name
          # remove the v from the version number
          $latest=$latest.Substring(1)
          Write-Host "Found the lastest version of $($repo):$latest"

          # download the checksums file of that release: it lists the SHA256 hash of each platform archive
          $checksumLines = gh release download "v$latest" --repo $repo --pattern "$($name)_$($latest)_checksums.txt" --output -
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Failed to download the checksums file for [$repo] version [$latest], cannot continue"
            exit 1
          }

          # build a sorted "<os>_<arch>" = "<sha256>" map to pin in settings.json
          $checksums = [ordered]@{}
          $found = @{}
          foreach ($line in $checksumLines) {
            if ($line.Trim() -match "^([0-9a-f]{64})\s+$([regex]::Escape($name))_$([regex]::Escape($latest))_([a-z0-9]+_[a-z0-9]+)\.(tar\.gz|zip)$") {
              $found[$Matches[2]] = $Matches[1]
            }
          }
          foreach ($platform in ($found.Keys | Sort-Object)) {
            $checksums[$platform] = $found[$platform]
          }

          if ($checksums.Count -eq 0) {
            Write-Host "No checksums found in the checksums file of version [$latest], cannot continue"
            exit 1
          }
          Write-Host "Found checksums for [$($checksums.Count)] platforms"

          Write-Host "Current version: [$($currentSettings.actionlintversiontag)], new version: [$latest]"

          # only update if the actual values have changed
          $currentChecksums = $currentSettings.checksums | ConvertTo-Json -Compress
          $newChecksums = [pscustomobject]$checksums | ConvertTo-Json -Compress
          if ($currentSettings.actionlintversiontag -eq $latest -and $currentChecksums -eq $newChecksums) {
            echo "settings.json values have not changed, no need to create a PR"
            exit 0
          }

          # write the info to the settings.json file using an ordered hashtable to keep key order stable
          $settings = [ordered]@{
            actionlintrepo = $repo
            actionlintname = $name
            actionlintversiontag = $latest
            checksums = $checksums
          }

          $settings | ConvertTo-Json | Out-File -FilePath settings.json -Encoding utf8
          cat settings.json

          $branchName = "update-actionlint-$latest"

          # check if the remote branch already exists
          $remoteBranch = git ls-remote --heads origin $branchName
          if ($remoteBranch) {
            echo "Remote branch $branchName already exists, deleting it to update with latest changes"
            git push origin --delete $branchName
          }

          git checkout -b $branchName

          echo "settings.json has changed, committing and pushing"
          git add settings.json
          git commit -m "Update actionlint version to $latest"
          git push --set-upstream origin $branchName

          # only create a PR if one doesn't already exist
          $existingPR = gh pr list --head $branchName --json number --jq '.[0].number'
          if (-not $existingPR) {
            gh pr create --title "Update actionlint version to $latest" --body "Update actionlint version to $latest" --base main --head $branchName
          }
          else {
            echo "PR #$existingPR already exists for branch $branchName and has been updated with the latest push"
          }
